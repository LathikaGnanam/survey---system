<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Feedback Hub</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Feedback Hub: Admin</h1><a href="index.html">Public page</a></header>
<main id="app"></main>
<script>
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function start(){ (await fetch('/api/me')).ok ? dash() : loginView(); }
function loginView(){
  app.innerHTML=`<div class="card"><h2>Admin login</h2><label>Username</label><input type="text" id="u"><label>Password</label><input type="password" id="p"><div class="row"><button onclick="login()">Log in</button></div><div id="msg"></div></div>`;
}
async function login(){
  const body=new URLSearchParams({username:u.value,password:p.value});
  const r=await fetch('/api/login',{method:'POST',body});
  r.ok?dash():document.getElementById('msg').innerHTML='<div class="msg bad">Wrong username or password</div>';
}
async function dash(){
  const list=await (await fetch('/api/surveys')).json();
  app.innerHTML=`<div class="card"><h2>Create a survey</h2>
  <label>Title</label><input type="text" id="t"><label>Description</label><input type="text" id="d">
  <label>Questions (one per line)</label>
  <textarea id="qs" placeholder="rating|How was the service?&#10;choice|Would you recommend us?|Yes,No,Maybe&#10;text|Any suggestions?"></textarea>
  <p class="muted">Formats: <b>rating|Question</b> (1 to 5), <b>choice|Question|A,B,C</b>, <b>text|Question</b></p>
  <div class="row"><button onclick="createSurvey()">Create survey</button></div><div id="msg"></div></div>
  <h2>Your surveys</h2>`+(list.length?list.map(s=>`<div class="card"><h3>${esc(s.title)}</h3><p class="muted">${s.count} response(s)</p><div class="row"><button onclick="results(${s.id})">View results</button><button class="danger" onclick="del(${s.id})">Delete</button></div><div id="r${s.id}"></div></div>`).join(''):'<div class="card">No surveys yet.</div>');
}
async function createSurvey(){
  const body=new URLSearchParams({title:t.value,description:d.value,questions:qs.value});
  const r=await fetch('/api/create',{method:'POST',body});
  if(r.ok) dash(); else document.getElementById('msg').innerHTML=`<div class="msg bad">${esc((await r.json()).error)}</div>`;
}
async function del(id){ if(confirm('Delete this survey and its responses?')){ await fetch('/api/delete?id='+id,{method:'POST'}); dash(); } }
async function results(id){
  const d=await (await fetch('/api/results?id='+id)).json();
  document.getElementById('r'+id).innerHTML=d.questions.map(q=>{
    if(q.type==='text') return `<h4>${esc(q.text)}</h4>`+(q.answers.length?`<ul class="answers">${q.answers.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:'<p class="muted">No answers yet</p>');
    const max=Math.max(1,...q.counts);
    const bars=q.labels.map((l,i)=>`<div class="bar"><span class="l">${esc(l)}</span><div style="width:${q.counts[i]/max*60}%"></div><span>${q.counts[i]}</span></div>`).join('');
    return `<h4>${esc(q.text)}${q.type==='rating'?` <span class="muted">(average ${q.avg})</span>`:''}</h4>${bars}`;
  }).join('')||'';
}
start();
</script></body></html>
